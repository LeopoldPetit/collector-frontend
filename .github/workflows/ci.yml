name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-scan-build:
    permissions:
      contents: read
      packages: write
    uses: LeopoldPetit/collector-infra/.github/workflows/reusable-lint-test-scan-build.yml@main
    with:
      image-name: ghcr.io/leopoldpetit/collector-frontend
      node-version: "22"
      push-image: ${{ github.event_name == 'push' }}
      build-args: |
        VITE_API_URL=https://api.localhost:8443
        VITE_KEYCLOAK_URL=https://keycloak.localhost:8443
